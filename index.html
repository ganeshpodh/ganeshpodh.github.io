<!DOCTYPE html>
<html>
<head>
<title>Ganesh Podh Website</title>

<style>
body{

.box{
    background:white;
    width:60%;

    padding:20px;

}

<body>

<h2>Simple Calculator</h2>

<input type="number" id="num1" placeholder="Enter first number">

<script>

function add(){

}
</script>
